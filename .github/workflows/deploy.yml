name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
            - name: Install Bun
        uses: oven-sh/setup-bun@v1

      - name: Copy index.html & Build
        run: |
          if [ -f "public/index.html" ]; then
            cp public/index.html ./index.html
          elif [ -f "index.html" ]; then
            echo "index.html exists"
          else
            cp ./lovable/index.html ./index.html 2>/dev/null || echo "No index.html template found"
          fi
          bun install
          bun run build

      - name: Create Static Root
        run: |
          mkdir -p ./artifact-root
          if [ -d ".output/public" ]; then
            cp -r .output/public/* ./artifact-root/
          elif [ -d "dist" ]; then
            cp -r dist/* ./artifact-root/
          elif [ -s ".output/server/index.mjs" ]; then
            # Fallback if it only built server output, copy public assets
            cp -r public/* ./artifact-root/ 2>/dev/null || true
          fi
          # Ensure 404 fallback exists for client-side routing
          if [ -f "./artifact-root/index.html" ]; then
            cp ./artifact-root/index.html ./artifact-root/404.html
          else
            echo "<h1>SpotlightMaker</h1>" > ./artifact-root/index.html
            cp ./artifact-root/index.html ./artifact-root/404.html
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './artifact-root'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
