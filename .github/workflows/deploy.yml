name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        
      - name: Copy index.html & Build
        run: |
          if [ -f "app/index.html" ]; then
            cp app/index.html ./index.html
          elif [ -f "src/index.html" ]; then
            cp src/index.html ./index.html
          elif [ -f "public/index.html" ]; then
            cp public/index.html ./index.html
          else
            echo "<!DOCTYPE html><html><head><title>SpotlightMaker</title></head><body><div id=\"app\"></div></body></html>" > ./index.html
          fi
          bun install
          bun run build
          
      - name: Create Static Root
        run: |
          mkdir -p ./artifact-root
          if [ -d ".output/public" ]; then
            cp -r .output/public/* ./artifact-root/
          elif [ -d "dist" ]; then
            cp -r dist/* ./artifact-root/
          fi
          if [ -f "./artifact-root/index.html" ]; then
            cp ./artifact-root/index.html ./artifact-root/404.html
          else
            echo "<h1>SpotlightMaker</h1>" > ./artifact-root/index.html
            cp ./artifact-root/index.html ./artifact-root/404.html
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './artifact-root'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
